[project]
name = "flakefinder"
version = "0.1.0"
description = "Automated 2D material flake detection system for Leica DM6M microscope"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pythonnet>=3.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.scripts]
flakefinder = "flakefinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flakefinder"]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
