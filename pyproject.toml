[project]
name = "flakefinder"
version = "0.1.0"
description = "Automated 2D material flake detection system for Leica DM6M microscope"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pythonnet>=3.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scipy>=1.17.0",
    "requests>=2.32.5",
]

[project.scripts]
flakefinder = "flakefinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flakefinder"]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "ty>=0.0.1a0",
    "pytest>=7.0.0",
    "matplotlib>=3.10.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",  # if-else-block-instead-of-if-exp — prefer explicit if/else for readability
    "SIM102",  # collapsible-if — same
    "B023",    # function-uses-loop-variable — polling threads capture mutable containers intentionally
    "F821",    # forward-ref annotations — waiting on pythonnet 3.14 support
]

[tool.ty.src]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.analysis]
# .NET SDK modules only resolve on the microscope PC (pythonnet runtime)
allowed-unresolved-imports = ["LeicaMicrosystems.**", "System.**"]

# cli.py — unmaintained, pending rewrite
[[tool.ty.overrides]]
include = ["src/flakefinder/cli.py"]
[tool.ty.overrides.rules]
all = "ignore"

# archive/ — superseded scripts, not actively maintained
[[tool.ty.overrides]]
include = ["archive/**"]
[tool.ty.overrides.rules]
all = "ignore"

# cv2 contour types don't satisfy ty's max() overloads
[[tool.ty.overrides]]
include = ["src/flakefinder/segmentation.py"]
[tool.ty.overrides.rules]
no-matching-overload = "ignore"


