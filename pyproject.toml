[project]
name = "flakefinder"
version = "0.1.0"
description = "Automated 2D material flake detection system for Leica DM6M microscope"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pythonnet>=3.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "scipy>=1.17.0",
    "requests>=2.32.5",
]

[project.scripts]
flakefinder = "flakefinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flakefinder"]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "matplotlib>=3.10.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",  # if-else-block-instead-of-if-exp — prefer explicit if/else for readability
    "SIM102",  # collapsible-if — same
    "B023",    # function-uses-loop-variable — polling threads capture mutable containers intentionally
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
